# Homolog only — RdoApp.Core on EC2 Windows :5081. Never deploys Equipamentos production (rdoapp :80).
name: Homolog Core EC2 (build + deploy)

on:
  workflow_dispatch:
    inputs:
      deploy_to_ec2:
        description: 'Upload S3 + SSM deploy to homolog EC2'
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'RDO-CleanMigration-2026/RDO-CleanMigration-2026/RdoApp.Core/**'
      - 'RDO-CleanMigration-2026/scripts/**'
      - '.github/workflows/homolog-core-ec2.yml'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-2
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: RDO-CleanMigration-2026/RDO-CleanMigration-2026/RdoApp.Core
  PUBLISH_DIR: publish/homolog-ec2
  ZIP_NAME: rdoapp_core.zip
  S3_KEY_PREFIX: rdoapp_core
  DEPLOY_SITE_PATH: 'C:\inetpub\wwwroot\homologacao\rdoapp_core'
  APPLY_SCRIPT_S3_KEY: rdoapp_core/scripts/ec2-apply-rdoapp-core.ps1

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      s3_key: ${{ steps.meta.outputs.s3_key }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: dotnet publish (win-x64 self-contained)
        run: |
          dotnet publish "${{ env.PROJECT_PATH }}/RdoApp.Core.csproj" \
            -c Release -r win-x64 --self-contained true \
            -o "${{ env.PUBLISH_DIR }}"

      - name: Zip artifact
        run: |
          cd "${{ env.PUBLISH_DIR }}"
          zip -r "../${{ env.ZIP_NAME }}" .

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: rdoapp_core-homolog
          path: publish/${{ env.ZIP_NAME }}
          retention-days: 14

      - id: meta
        run: |
          KEY="${{ env.S3_KEY_PREFIX }}/rdoapp_core-${GITHUB_SHA::7}-${GITHUB_RUN_ID}.zip"
          echo "s3_key=$KEY" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_to_ec2 == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rdoapp_core-homolog
          path: artifact

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload zip + apply script to S3
        env:
          BUCKET: ${{ vars.HOMOLOG_CORE_S3_BUCKET }}
          S3_KEY: ${{ needs.build.outputs.s3_key }}
        run: |
          if [ -z "$BUCKET" ]; then echo "Configure repository variable HOMOLOG_CORE_S3_BUCKET"; exit 1; fi
          aws s3 cp "artifact/${{ env.ZIP_NAME }}" "s3://${BUCKET}/${S3_KEY}"
          aws s3 cp "RDO-CleanMigration-2026/scripts/ec2-apply-rdoapp-core.ps1" \
            "s3://${BUCKET}/${{ env.APPLY_SCRIPT_S3_KEY }}"

      - name: SSM deploy on homolog EC2
        env:
          BUCKET: ${{ vars.HOMOLOG_CORE_S3_BUCKET }}
          INSTANCE_ID: ${{ vars.HOMOLOG_EC2_INSTANCE_ID }}
          APP_POOL: ${{ vars.HOMOLOG_IIS_APP_POOL }}
          S3_KEY: ${{ needs.build.outputs.s3_key }}
        run: |
          if [ -z "$INSTANCE_ID" ]; then echo "Configure repository variable HOMOLOG_EC2_INSTANCE_ID"; exit 1; fi
          C1='$script = Join-Path $env:TEMP ''ec2-apply-rdoapp-core.ps1'''
          C2="aws s3 cp s3://${BUCKET}/${{ env.APPLY_SCRIPT_S3_KEY }} `$script --region ${{ env.AWS_REGION }}"
          if [ -n "$APP_POOL" ]; then
            C3="powershell -ExecutionPolicy Bypass -File `$script -S3Bucket '${BUCKET}' -S3Key '${S3_KEY}' -SitePath '${{ env.DEPLOY_SITE_PATH }}' -AwsRegion '${{ env.AWS_REGION }}' -AppPoolName '${APP_POOL}'"
          else
            C3="powershell -ExecutionPolicy Bypass -File `$script -S3Bucket '${BUCKET}' -S3Key '${S3_KEY}' -SitePath '${{ env.DEPLOY_SITE_PATH }}' -AwsRegion '${{ env.AWS_REGION }}'"
          fi
          jq -n --arg c1 "$C1" --arg c2 "$C2" --arg c3 "$C3" '{commands: [$c1,$c2,$c3]}' > params.json
          CID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunPowerShellScript \
            --parameters file://params.json \
            --query Command.CommandId --output text)
          echo "CommandId=$CID"
          for i in $(seq 1 36); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" --query Status --output text)
            echo "Status=$STATUS ($i/36)"
            if [ "$STATUS" = "Success" ]; then
              aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
              exit 0
            fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" --output json
              exit 1
            fi
            sleep 10
          done
          exit 1
