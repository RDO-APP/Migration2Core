<!-- KILL SCRIPT: Force redirect to new Razor Login -->
<script type="text/javascript">
    // Immediate redirect to new AccountController login
    if (window.location.pathname.toLowerCase().includes('escolher') || 
        window.location.pathname.toLowerCase().includes('obra') ||
        window.location.pathname === '/' ||
        window.location.pathname === '') {
        
        // Clear any legacy session storage
        if (typeof(Storage) !== "undefined") {
            localStorage.clear();
            sessionStorage.clear();
        }
        
        // Force redirect to new login
        window.location.replace('/Account/Login');
    }
</script>

<section ng-controller="ObraController as controller" ng-init="controller.carregarLista();">

    <div class="container text-center">
        <div class="row">
            <div class="col">
                <label class="control-label filtro" type="text" name="unidade_escolar" placeholder="Unidade escolar" >Filtros</label>
            </div>

            <div class="col-md-3 col-md-offset-3">
                <input class="form-control" type="text" name="unidade_escolar" placeholder="Unidade escolar" autofocus ng-model="controller.filtroUnidade"/>
            </div>
            <div class="col-md-3">
                <input class="form-control" type="text" name="municipio" placeholder="Município" ng-model="controller.filtroMunicipio"/>
            </div>
        </div>
    </div>


    <h2>Selecione uma das unidades escolares abaixo:</h2>
    <div class="lista-obras">
        <label ng-hide="controller.obras.length > 0" class="col-xs-12 no-padding" style="text-align:center;">Você deve cadastrar uma unidade escolar para começar a usar o sistema.</label>
        <div class="item" ng-repeat="obra in controller.obras | filter:{ descricao: controller.filtroUnidade, cidadeEstado: controller.filtroMunicipio }">
            <button class="btn change-background" ng-click="controller.escolherObra(obra)">
                <i class="icon-{{obra.contratanteContratada}}"></i>
                <H5>{{obra.descricao}}</H5>
                <p>{{obra.cidadeEstado}}</p>
                <p>({{obra.statusBasicaGratuita}})</p>

                <small>STATUS</small>
                <div class="progress progress-line-info {{ obra.classeStatusCss }}">

                    <i class="fa fa-exclamation-triangle ng-hide" ng-hide="true" aria-hidden="true"></i>
                    <div class="progress-bar progress-bar-info " role="progressbar" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100" style="width: {{ 100 - obra.progressoPorcentagem }}%;">

                        <span class="branco ng-binding">{{ obra.progressoPorcentagem }}%</span>

                    </div>
                    <span class="azul ng-binding">{{ obra.progressoPorcentagem }}%</span>

                </div>

            </button>
        </div>
    </div>


    <div class="col-xs-12 no-padding area-legenda" ng-if="controller.obras.length > 0">
        <div class="">
            <label>BARRA DE PROGRESSO DA UNIDADE ESCOLAR:</label>
            <div class="legenda">
                <i class="status bg-verde"></i>

                <small>UNIDADE ESCOLAR COM PRAZO ESTIMADO ATINGIDO</small>
            </div>
            <div class="legenda">
                <i class="status bg-vermelho"></i>


                <small>UNIDADE ESCOLAR COM PRAZO ESTIMADO ULTRAPASSADO</small>
            </div>
            <div class="legenda">
                <i class="status bg-cinza"></i>

                <small>UNIDADE ESCOLAR EM ANDAMENTO</small>
            </div>


        </div>
    </div>
</section>
